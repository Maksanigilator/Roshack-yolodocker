services:
  pipe_rail_autodock:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: yolo:latest
    container_name: pipe_rail_autodock
    network_mode: host
    ipc: host
    privileged: true
    gpus: all
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ./:/root/ros_ws
      - ./ros_ws/weights/runs:/ultralytics/runs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
    command: zsh
